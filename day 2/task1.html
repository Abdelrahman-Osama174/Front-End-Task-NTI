<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task 1</title>

    <style>
        body {
            background-color: rgb(0, 96, 205);
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: large;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            align-items: center;
            gap: 25px;

            width: 90%;
            padding: 10px 20px;
            box-sizing: border-box;

            background-color: rgb(162, 162, 162);
            border-radius: 5px;
        }

        .img {
            display: flex;
            align-items: center;
        }

        img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .item {
            cursor: pointer;
        }

        .item p {
            margin: 0;
        }

        .button {
            margin-left: auto;
        }

        button {
            background-color: orangered;
            color: white;
            width: 120px;
            height: 40px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: gray;
            color: black;
        }

        @media (max-width: 480px) {
            .container {
                width: 95%;
                gap: 12px;
                padding: 10px;
                flex-wrap: wrap;
            }

            .button {
                margin-left: auto;
            }

            button {
                width: 90px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="img">
            <img src="img/image1.png" alt="Personal image">
        </div>

        <div class="item">
            <p>Home</p>
        </div>

        <div class="item">
            <p>About</p>
        </div>

        <div class="item">
            <p>Contact</p>
        </div>

        <div class="button">
            <button type="button">
                <b>Started</b>
            </button>
        </div>

    </div>

</body>
</html>
