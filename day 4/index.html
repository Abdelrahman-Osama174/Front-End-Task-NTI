<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse products from the Fake Store API."
    />
    <title>Products | Fake Store</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        color: #1f2937;
        background: #f3f4f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      header {
        padding: 2rem 1rem;
        color: white;
        background: #1d4ed8;
        text-align: center;
      }

      h1 {
        margin: 0;
      }

      main {
        width: min(1200px, 100%);
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
      }

      #status {
        margin: 0 0 1rem;
        text-align: center;
      }

      #products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
        gap: 1rem;
      }

      .product-card {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 1rem;
        overflow-wrap: anywhere;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 0.75rem;
        box-shadow: 0 2px 8px rgb(0 0 0 / 5%);
      }

      .product-image {
        width: 100%;
        height: 220px;
        object-fit: contain;
        background: white;
      }

      .product-card h2,
      .product-card p {
        margin: 0;
      }

      .product-category {
        color: #4b5563;
        text-transform: capitalize;
      }

      .product-price {
        color: #1d4ed8;
        font-size: 1.25rem;
        font-weight: bold;
      }

      .product-description {
        line-height: 1.5;
      }

      .product-rating {
        padding-top: 0.75rem;
        border-top: 1px solid #e5e7eb;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Our Products</h1>
    </header>
    <main>
      <p id="status" role="status" aria-live="polite">Loading products...</p>
      <section id="products" aria-label="Products"></section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
