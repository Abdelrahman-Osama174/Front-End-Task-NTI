<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore thoughtful everyday essentials in the Northstar online store."
    />
    <title>Northstar — Everyday essentials</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="site-header navbar navbar-expand-lg">
      <div class="header-inner">
        <a class="brand" href="#" data-action="home" aria-label="Northstar home">
          <span class="brand-mark" aria-hidden="true">N</span>
          <span>northstar<span class="brand-period">.</span></span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#primary-navigation"
          aria-controls="primary-navigation"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <div class="collapse navbar-collapse" id="primary-navigation">
          <nav class="main-nav navbar-nav" aria-label="Main navigation">
            <button class="nav-link active" type="button" data-action="home">
              <i class="bi bi-house-door me-1" aria-hidden="true"></i>Home
            </button>
            <button class="nav-link" type="button" data-action="products">
              <i class="bi bi-grid me-1" aria-hidden="true"></i>Products
            </button>
            <button class="nav-link" type="button" data-action="cart">
              <i class="bi bi-bag me-1" aria-hidden="true"></i>Cart
              <span id="cart-count" class="count-badge">0</span>
            </button>
            <button class="nav-link" type="button" data-action="wishlist">
              <i class="bi bi-heart me-1" aria-hidden="true"></i>Wishlist
            </button>
            <button class="nav-link customer-only" type="button" data-action="orders">My orders</button>
            <button class="nav-link admin-only hidden" type="button" data-action="admin">Admin</button>
          </nav>
          <div id="account-actions" class="account-actions">
            <button class="button button-quiet" type="button" data-action="login">Log in</button>
            <button class="button button-dark" type="button" data-action="register">Create account</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
      <div id="app-content"></div>
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <a class="footer-brand" href="#" data-action="home">northstar<span>.</span></a>
        <p>Thoughtful essentials for your everyday.</p>
        <span class="footer-note">Designed with care. Made for daily life.</span>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
